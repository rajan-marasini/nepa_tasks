services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:17-alpine
    container_name: nepa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-event_dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-event_dashboard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Backend REST & WebSocket API ---
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nepa_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-event_dashboard}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-uKHPantaVfLNK9CqbvSyPVri4KdLNKV1}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # --- Frontend React Single Page Application ---
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws}
    container_name: nepa_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      - server
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
